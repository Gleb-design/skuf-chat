<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Вот эта строчка спасает мобильную верстку: -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анонимный чат для Скуфов 🍻</title>
  
  <!-- Open Graph (Telegram, WhatsApp, Discord, VK) -->
  <meta property="og:title" content="SKUF-CHAT — Анонимный чат для Скуфов 🍻">
  <meta property="og:description" content="Заходи в гараж, найди собеседника. Без регистрации, без имён — только скуфы, пиво и разговоры за жизнь.">
  <meta property="og:image" content="https://skuf-chat.onrender.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://skuf-chat.onrender.com">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SKUF-CHAT">
  <meta property="og:locale" content="ru_RU">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SKUF-CHAT — Анонимный чат для Скуфов 🍻">
  <meta name="twitter:description" content="Без регистрации, без имён — только скуфы, пиво и разговоры за жизнь.">
  <meta name="twitter:image" content="https://skuf-chat.onrender.com/og-image.png">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">

</head>
<body>
<div class="app-container">
  <!-- Боковая (или верхняя на мобилках) панель — теперь ТУТ ТОЛЬКО КНОПКИ -->
  <aside class="sidebar">
    <nav class="chat-modes">
      <button class="mode-btn active" id="btnGeneral"><span>🍻</span> Общая флудилка</button>
      <button class="mode-btn" id="btnPrivate"><span>🎯</span> Поиск скуфа</button>
    </nav>
  </aside>

  <!-- Основная зона чата -->
  <main class="chat-area">
    <!-- Шапка чата -->
    <header class="chat-header">
      <div class="header-top-line">
        <h2 id="chatTitle">📢 Общая флудилка (Скуф-Курилка)</h2>
        <button class="mini-flush-btn" onclick="location.reload()" title="Смыть историю">🧼</button>
      </div>
      <div class="online-counter" id="onlineCounter">🍺 Сейчас в гараже: <strong>...</strong></div>
      <div class="typing-indicator" id="typingIndicator"></div>
    </header>

        <!-- Кнопки управления приватным чатом (появляются только в режиме рулетки) -->
    <div class="private-controls hidden" id="privateControls">
      <button id="btnNextSkuf">🔄 Следующий скуф</button>
      <button id="btnCancelSearch">❌ Выйти во флудилку</button>
    </div>


    <!-- Окна с сообщениями -->
    <div class="messages-container" id="generalMessagesBox">
      <div class="system-msg">Добро пожаловать в Главный Гараж.</div>
    </div>

    <div class="messages-container" id="privateMessagesBox" style="display: none;">
      <div class="system-msg">Поиск собеседника... Налейте пока квасу.</div>
    </div>

    <!-- Зона ввода сообщения -->
    <footer class="chat-input-area">
      <!-- Новое место для имени пользователя: аккуратная плашка над инпутом -->
      <div class="user-bottom-profile">
        <span>Вы вошли как: <strong id="myUsername">Загрузка...</strong></span>
      </div>
      
      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Написать в чат..." autocomplete="off">
        <button id="sendBtn">Отправить 🚀</button>
      </div>
    </footer>
  </main>
</div>

  <!-- Подключаем Socket.io (сервер отдаст этот файл автоматически) и наш клиент -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Виджет-система готова!'))
      .catch((err) => console.log('Сбой PWA:', err));
  }
</script>

</body>
</html>
