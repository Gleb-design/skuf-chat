<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Вот эта строчка спасает мобильную верстку: -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анонимный чат для Скуфов 🍻</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">

</head>
<body>
<div class="app-container">
  <!-- Боковая (или верхняя на мобилках) панель — теперь ТУТ ТОЛЬКО КНОПКИ -->
  <aside class="sidebar">
    <nav class="chat-modes">
      <button class="mode-btn active" id="btnGeneral"><span>🍻</span> Общая флудилка</button>
      <button class="mode-btn" id="btnPrivate"><span>🎯</span> Поиск скуфа</button>
    </nav>
  </aside>

  <!-- Основная зона чата -->
  <main class="chat-area">
    <!-- Шапка чата -->
    <header class="chat-header">
      <div class="header-top-line">
        <h2 id="chatTitle">📢 Общая флудилка (Скуф-Курилка)</h2>
        <button class="mini-flush-btn" onclick="location.reload()" title="Смыть историю">🧼</button>
      </div>
    </header>

    <!-- Окна с сообщениями -->
    <div class="messages-container" id="generalMessagesBox">
      <div class="system-msg">Добро пожаловать в Главный Гараж.</div>
    </div>

    <div class="messages-container" id="privateMessagesBox" style="display: none;">
      <div class="system-msg">Поиск собеседника... Налейте пока квасу.</div>
    </div>

    <!-- Зона ввода сообщения -->
    <footer class="chat-input-area">
      <!-- Новое место для имени пользователя: аккуратная плашка над инпутом -->
      <div class="user-bottom-profile">
        <span>Вы вошли как: <strong id="myUsername">Загрузка...</strong></span>
      </div>
      
      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Написать в чат..." autocomplete="off">
        <button id="sendBtn">Отправить 🚀</button>
      </div>
    </footer>
  </main>
</div>

  <!-- Подключаем Socket.io (сервер отдаст этот файл автоматически) и наш клиент -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Виджет-система готова!'))
      .catch((err) => console.log('Сбой PWA:', err));
  }
</script>

</body>
</html>
